<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#faf8ff"><title>Housemate — A little light for your day</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div id="ambient" aria-hidden="true"><div class="light-layer active" data-light="default"></div><div class="light-layer" data-light="joy"></div><div class="light-layer" data-light="calm"></div><div class="light-layer" data-light="rest"></div><div class="light-layer" data-light="steady"></div><div class="light-layer" data-light="mixed"></div><div class="light-layer" data-light="melancholy"></div></div><main class="chat-app"><header><a class="brand" href="/" aria-label="Housemate home"><span class="brand-dot"></span>housemate<span class="brand-period">.</span></a><div class="header-actions"><button id="motion" type="button" aria-pressed="false">Pause light</button><button id="clear" type="button">New moment <span aria-hidden="true">↗</span></button></div></header><section id="messages" aria-label="Conversation" role="log" aria-live="polite"><div id="welcome"><p class="eyebrow">A LITTLE LIGHT FOR YOUR DAY</p><h1>How are you,<br><em>really?</em></h1><p class="intro">Tell me a little about your day.<br>Let your feelings become light.</p><div class="examples"><button type="button">It's my birthday today.</button><button type="button">Happy, but a little lonely.</button><button type="button">I just need a quiet moment.</button></div></div></section><div class="bottom"><div id="light-status" role="status">Soft light. Room to feel.</div><form id="composer"><label class="sr-only" for="question">Share a moment</label><textarea id="question" placeholder="What's on your mind?" maxlength="2000" rows="1"></textarea><div class="composer-bottom"><span id="counter">0 / 2000</span><span class="key-hint">Enter to share</span><button id="send" type="submit" aria-label="Share your moment"><span id="send-label">Share</span><span aria-hidden="true">↗</span></button></div></form><footer>AI can misread a feeling. You know yours best.<span>Your words are sent to OpenAI. This page keeps no saved history.</span></footer></div></main></body></html>
